name: Build and test
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # allows manual triggering

permissions:
  contents: read

# A pull request's superseded run is cancelled; on `main` the run in flight
# finishes so that every push still gets a verdict (see build-with-buck2.yml).
concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # rust-cache keeps only the dependency artifacts between runs, so every run
  # compiles the workspace crates from scratch and incremental compilation only
  # costs time and disk.
  CARGO_INCREMENTAL: 0
  # Backtraces keep their file:line; nothing in CI attaches a debugger. The
  # `test` profile inherits this from `dev`.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # Clippy and rustdoc check the crates; the tests build them. The two share no
  # artifacts, so they run as separate jobs for wall time.
  #
  # Runner labels are repository (owner) specific, so the Meta larger runners
  # (16-core-ubuntu, macos-15-xlarge, windows-8-core) don't exist on forks and
  # jobs requesting them would sit queued forever waiting for a runner that
  # isn't available. Fall back to the standard GitHub-hosted runners there.
  lint:
    name: lint (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runs-on: ${{ github.repository_owner == 'meta' && '16-core-ubuntu' || 'ubuntu-latest' }}
          - name: macos
            runs-on: ${{ github.repository_owner == 'meta' && 'macos-15-xlarge' || 'macos-15' }}
          - name: windows
            runs-on: ${{ github.repository_owner == 'meta' && 'windows-8-core' || 'windows-latest' }}
    runs-on: ${{ matrix.runs-on }}
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup_cargo_env
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: buck2-lint
        cache-on-failure: true
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Run clippy
      run: python3 test.py --ci --git --lint-only
      shell: bash
    - name: Run rustdoc
      run: python3 test.py --ci --git --rustdoc-only
      shell: bash
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runs-on: ${{ github.repository_owner == 'meta' && '16-core-ubuntu' || 'ubuntu-latest' }}
          - name: macos
            runs-on: ${{ github.repository_owner == 'meta' && 'macos-15-xlarge' || 'macos-15' }}
          - name: windows
            runs-on: ${{ github.repository_owner == 'meta' && 'windows-8-core' || 'windows-latest' }}
    runs-on: ${{ matrix.runs-on }}
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup_cargo_env
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: buck2-test
        cache-on-failure: true
        save-if: ${{ github.ref == 'refs/heads/main' }}
    # The unix tests that launch a shell need the declared shell, a canonical Nix store bash with
    # `sh` beside it (app/buck2_test/src/testing.rs); there is no fallback to a host shell.
    - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      if: runner.os != 'Windows'
    - name: Provide the declared shell
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        out=$(nix build --no-link --print-out-paths '.#ci-test-shell^out')
        shell=$(realpath "$out/bin/bash")
        if [[ "$shell" != /nix/store/* || "$shell" != "$out/bin/bash" ]]; then
          echo "::error::the declared shell $out/bin/bash is not a canonical Nix store path ($shell)"
          exit 1
        fi
        if [[ ! -x "$out/bin/sh" ]]; then
          echo "::error::the declared shell's store directory has no executable sh: $out/bin"
          exit 1
        fi
        echo "BUCK2_TEST_DECLARED_SHELL=$shell" >> "$GITHUB_ENV"
    - name: Run the tests
      run: python3 test.py --ci --git --test-only
      shell: bash
