name: setup_rust_toolchain
description: Install the Rust toolchain named in rust-toolchain.toml
inputs:
  components:
    description: Comma-separated rustup components to install alongside it
    default: ""
runs:
  using: composite
  steps:
  - uses: SebRollen/toml-action@v1.2.0
    id: read_rust_toolchain
    with:
      file: rust-toolchain.toml
      field: toolchain.channel
  - uses: dtolnay/rust-toolchain@v1
    with:
      toolchain: ${{ steps.read_rust_toolchain.outputs.value }}
      components: ${{ inputs.components }}
  # Keep this outside autocargo's generated Cargo configuration.
  - name: Set Cargo registry publish-age policy
    shell: bash
    run: |
      echo 'CARGO_UNSTABLE_MIN_PUBLISH_AGE=true' >> "$GITHUB_ENV"
      echo 'CARGO_REGISTRY_GLOBAL_MIN_PUBLISH_AGE=14 days' >> "$GITHUB_ENV"
      echo 'CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE=deny' >> "$GITHUB_ENV"
